[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivm-xyz"
version = "0.2.0"
description = "Convert between XYZ and IVM geometric spaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "IVM-XYZ Contributors"}
]
keywords = ["geometry", "mathematics", "tetrahedron", "ivm", "quadray", "synergetics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.0.0",
    "imageio>=2.0.0",
    # Security floor: pillow is transitive via matplotlib/imageio (GHSA-8g5g-8vmr-9782).
    "pillow>=13.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/docxology/ivm-xyz"
Documentation = "https://github.com/docxology/ivm-xyz"
Repository = "https://github.com/docxology/ivm-xyz"
Issues = "https://github.com/docxology/ivm-xyz/issues"

[tool.setuptools]
packages = [
    "ivm_xyz",
    "ivm_xyz.core",
    "ivm_xyz.conversion",
    "ivm_xyz.polyhedra",
    "ivm_xyz.visualization",
]

[tool.setuptools.package-data]
ivm_xyz = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# python_version is intentionally left unpinned: pinning it to 3.10 makes mypy
# reject numpy's PEP 695 stubs. Our own code is 3.11-safe (every module uses
# `from __future__ import annotations` and typing.{Tuple,Dict,List}).
[tool.mypy]
files = ["ivm_xyz"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
