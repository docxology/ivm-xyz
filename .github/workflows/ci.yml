name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (dev + visualization)
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra visualization

      - name: Run tests with coverage
        env:
          MPLBACKEND: Agg
        run: >-
          uv run --python ${{ matrix.python-version }} python -m pytest tests/ -v
          --cov=ivm_xyz --cov-report=term-missing --cov-fail-under=95

  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      # Visualization extra is required so mypy sees matplotlib's real types
      # (the buffer_rgba type: ignore would otherwise register as unused).
      - name: Sync dev + visualization dependencies
        run: uv sync --extra dev --extra visualization

      - name: Verify lockfile freshness
        run: uv lock --check

      - name: black --check
        run: uv run black --check ivm_xyz/ tests/ scripts/ examples/

      - name: flake8
        run: uv run flake8 ivm_xyz/ tests/ scripts/ examples/

      - name: mypy
        run: uv run mypy

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Audit locked dependencies for known vulnerabilities
        run: |
          uv sync --all-extras
          uvx pip-audit --skip-editable
