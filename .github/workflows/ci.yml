name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (dev + visualization)
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra visualization

      - name: Run tests with coverage
        env:
          MPLBACKEND: Agg
        run: >-
          uv run --python ${{ matrix.python-version }} python -m pytest tests/ -v
          --cov=ivm_xyz --cov-report=term-missing --cov-fail-under=95

  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Visualization extra is required so mypy sees matplotlib's real types
      # (the buffer_rgba type: ignore would otherwise register as unused).
      - name: Sync dev + visualization dependencies
        run: uv sync --extra dev --extra visualization

      - name: black --check
        run: uv run black --check ivm_xyz/ tests/ scripts/ examples/ setup.py

      - name: flake8
        run: uv run flake8 ivm_xyz/ tests/ scripts/ examples/

      - name: mypy
        run: uv run mypy
