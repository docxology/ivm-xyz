# Run `uv run pre-commit install` once, then these hooks run on every commit.
# Update pinned revs with `uv run pre-commit autoupdate`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: ["--line-length=100"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^ivm_xyz/
        # matplotlib is required so the buffer_rgba `type: ignore` in the
        # visualization module is seen as used (warn_unused_ignores is on).
        additional_dependencies: ["numpy", "matplotlib"]
